# 扶摇 — 同花顺官方金融数据 API 插件 (https://fuyao.aicubes.cn)
# 纯 HTTP REST 源, 无额外依赖 (runtime: none)。
# 需在 .env 或环境变量配置 FUYAO_API_KEY, 未配置时插件灰显不可切换。
# 分钟K (minute) 走同花顺 quota-h single_kline 私有网关 (与 aicubes 官方 REST 不同
# surface, 无鉴权头/IP 白名单), 见 provider.get_minute 与 quota_kline.py 文档。

name: fuyao
display_name: "fuyao"
runtime: none
entry: app.plugins.fuyao.provider:FuyaoProvider
check: app.plugins.fuyao.provider:availability
datasets: [realtime, daily, adj_factor, financial, minute]
api_key_env: FUYAO_API_KEY   # 声明后设置页提供 Key 输入框(先探后存, secrets.json 优先)
description: "同花顺官方 REST 数据 API。A 股实时快照、日K(原始价: 近端走 10d dump, 深窗口走 10 年全量 dump 一次下载秒级筛选, 兜底单标的接口)、除权因子(事件 dump + 本地日K dump 配价推导, 涨跌停自检, 秒级)、财务(利润表/资产负债表/现金流量表/指标, 字段映射至项目口径, bps 由估值反推; 股本无上游接口, 指标历史期建议切回 TickFlow 补齐)、1分钟K(quota-h single_kline, 不复权 actual; 覆盖沪深股票/ETF及部分指数, 留存约 2 个月, 浅源; 量口径同日K为手)。"
install_hint: "点击卡片中的输入框配置 API Key(https://fuyao.aicubes.cn 申请),或在 .env 中配置 FUYAO_API_KEY"
homepage: "https://fuyao.aicubes.cn"
